<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UNO Rooms</title>
<style>
:root{--bg:#0d1020;--line:#ffffff1f;--r:#e53935;--y:#f5b800;--g:#1f9d55;--b:#2f6fed;--cw:62px}
@media(min-width:700px){:root{--cw:84px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 600px at 15% -10%,#3b1d6e,transparent),radial-gradient(800px 600px at 100% 110%,#0e4a63,transparent),var(--bg);color:#f1f0ff;font:600 15px/1.35 "Trebuchet MS",system-ui,sans-serif;overflow:hidden}
h1{font:900 clamp(44px,12vw,84px)/.9 "Arial Black",Impact,sans-serif;margin:0;letter-spacing:-2px;font-style:italic;color:#fff;text-shadow:3px 3px 0 var(--r),6px 6px 0 var(--y)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.scr.on{display:flex}
.panel{background:#ffffff12;border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(8px)}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0006;color:#fff;font:inherit;font-size:16px;outline:none}
input:focus,button:focus-visible{outline:2px solid var(--y)}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 18px;background:#ffffff1f;color:#fff;cursor:pointer;transition:transform .12s,background .2s}
button:active{transform:scale(.95)}button:disabled{opacity:.4;cursor:default}
.pri{background:linear-gradient(135deg,#ff5a36,#f5b800);color:#1b1026}
.sm{padding:6px 10px;font-size:13px}
.center{margin:auto;width:min(440px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
.row{display:flex;gap:10px}.row>*{flex:1}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.avs button{padding:6px 0;font-size:22px;background:#ffffff10}.avs .sel{background:#f5b80055;outline:2px solid var(--y)}
.err{color:#ff8a80;min-height:20px;font-size:14px}
.code{font:900 44px/1 "Arial Black",monospace;letter-spacing:8px;cursor:pointer}
.plist{display:grid;gap:8px;margin:0;padding:0;list-style:none;text-align:left}
.plist li{display:flex;align-items:center;gap:10px;background:#ffffff0d;border-radius:12px;padding:8px 12px}
.plist .a{font-size:26px}.plist .nm{flex:1}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 2px;scrollbar-width:none}
.chip{flex:none;min-width:74px;text-align:center;background:#ffffff12;border:2px solid transparent;border-radius:14px;padding:6px 8px;position:relative;transition:.25s}
.chip .a{font-size:26px}.chip small{display:block;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.turn{border-color:var(--y);background:#f5b80030;transform:translateY(-2px);box-shadow:0 0 18px #f5b80066}
.chip.off{opacity:.4}.chip.me small{color:var(--y)}
.chip .n{position:absolute;top:-6px;right:-6px;background:#fff;color:#111;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:900}
.chip .x{position:absolute;top:-6px;left:-6px;background:#c62828;border-radius:99px;width:20px;height:20px;padding:0;font-size:11px}
.table{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:0}
.piles{display:flex;gap:26px;align-items:center}
.ring{padding:8px;border-radius:18px;transition:.3s;box-shadow:0 0 0 4px var(--rc,#fff5),0 0 40px var(--rc,#fff3)}
.dir{font-size:30px;display:inline-block;animation:spin 6s linear infinite}.dir.ccw{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{font-weight:900;font-size:17px;text-align:center}
.card{width:var(--cw);height:calc(var(--cw)*1.5);border-radius:11px;background:var(--c);border:3px solid #fff;position:relative;flex:none;display:grid;place-items:center;box-shadow:0 5px 14px #0007;cursor:pointer;user-select:none;transition:transform .15s,filter .2s;overflow:hidden}
.card:before{content:"";position:absolute;inset:14% 6%;background:#fff3;border-radius:50%;transform:rotate(-28deg)}
.card i{font:900 calc(var(--cw)*.44)/1 "Arial Black",sans-serif;font-style:normal;color:#fff;text-shadow:0 3px 0 #0004;z-index:1}
.card b{position:absolute;top:3px;left:6px;font-size:calc(var(--cw)*.2);color:#fff;z-index:1}
.card.r{--c:var(--r)}.card.y{--c:var(--y)}.card.g{--c:var(--g)}.card.b{--c:var(--b)}
.card.w{background:conic-gradient(var(--r) 0 25%,var(--y) 0 50%,var(--g) 0 75%,var(--b) 0)}
.card.back{--c:#17151f;border-color:#eee}.card.back:before{background:var(--r)}.card.back i{font-size:calc(var(--cw)*.3);font-style:italic;color:var(--y)}
.card.land{animation:land .45s cubic-bezier(.2,.9,.3,1.2)}.card.deal{animation:deal .5s cubic-bezier(.2,.9,.3,1)}
@keyframes land{from{transform:translateY(38vh) scale(1.3) rotate(40deg);opacity:0}}
@keyframes deal{from{transform:translateY(-55vh) scale(.5) rotate(-25deg);opacity:0}}
.pulse{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.06)}}
#hand{display:flex;overflow-x:auto;padding:26px 14px 10px;justify-content:safe center;scrollbar-width:none}
#hand .card+.card{margin-left:calc(var(--cw)*-.32)}
#hand .card.ok{transform:translateY(-16px)}#hand .card.ok:hover{transform:translateY(-28px)}
#hand .card.no{filter:brightness(.5) saturate(.6);cursor:default}
.acts{display:flex;gap:10px;justify-content:center;min-height:46px}
.uno{background:linear-gradient(135deg,#e53935,#ff8a00);font-size:18px;padding:12px 26px}
.log{text-align:center;font-size:13px;opacity:.7;min-height:18px}
.emo{display:flex;gap:6px;justify-content:center}.emo button{padding:4px 9px;font-size:18px;background:#ffffff10}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:9;padding:20px}.modal.on{display:grid}
.modal .panel{text-align:center;background:#1a1730;min-width:min(320px,100%)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.pick button{height:70px;border-radius:16px;border:3px solid #fff}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:8;pointer-events:none}
#toast div{background:#000c;border:1px solid var(--line);padding:6px 12px;border-radius:99px;animation:tin .3s,tout .4s 3s forwards}
@keyframes tin{from{transform:translateY(-12px);opacity:0}}@keyframes tout{to{opacity:0}}
#conn{position:fixed;bottom:0;left:0;right:0;background:#c62828;text-align:center;padding:4px;font-size:13px;display:none;z-index:20}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="toast"></div><div id="conn">Reconnecting…</div>

<section id="home" class="scr on"><div class="center">
  <h1>UNO</h1><div style="opacity:.75">Up to 10 friends. One room code.</div>
  <div class="panel" style="display:flex;flex-direction:column;gap:12px">
    <input id="name" maxlength="16" placeholder="Your name" autocomplete="off">
    <div class="avs" id="avs"></div>
    <button class="pri" id="create">Create room</button>
    <div class="row"><input id="code" maxlength="6" placeholder="ROOM CODE" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:4px;text-align:center"><button id="join">Join</button></div>
    <div class="err" id="err"></div>
  </div></div></section>

<section id="lobby" class="scr"><div class="center">
  <div class="panel"><div style="opacity:.7">Room code — tap to copy</div><div class="code" id="lcode"></div></div>
  <div class="panel"><div style="text-align:left;margin-bottom:8px"><span id="lcount"></span></div><ul class="plist" id="plist"></ul></div>
  <button class="pri" id="start">Start game</button><div id="wait" style="opacity:.7"></div>
  <button id="leave1" class="sm">Leave room</button></div></section>

<section id="game" class="scr">
  <div class="top"><div><b id="gcode" style="letter-spacing:3px"></b></div><div id="deckn" style="opacity:.75"></div><button class="sm" id="leave2">Leave</button></div>
  <div class="chips" id="chips"></div>
  <div class="table">
    <div class="banner" id="banner"></div>
    <div class="piles"><div id="drawpile"></div><span class="dir" id="dir">↻</span><div class="ring" id="ring"><div id="disc"></div></div></div>
    <div class="log" id="log"></div>
  </div>
  <div class="acts"><button id="pass" class="sm" style="display:none">Keep card &amp; pass</button><button id="uno" class="uno">UNO!</button><button id="catch" class="pri" style="display:none">Catch!</button></div>
  <div id="hand"></div>
  <div class="emo" id="emo"></div>
</section>

<div class="modal" id="colors"><div class="panel">Choose a color<div class="pick">
  <button style="background:var(--r)" data-c="r"></button><button style="background:var(--y)" data-c="y"></button>
  <button style="background:var(--g)" data-c="g"></button><button style="background:var(--b)" data-c="b"></button></div></div></div>
<div class="modal" id="over"><div class="panel"><div style="font-size:54px">🏆</div><h2 id="wtxt" style="margin:6px 0 16px"></h2>
  <button class="pri" id="again">Play again</button><div id="owait" style="opacity:.7"></div></div></div>

<script>
const $=s=>document.querySelector(s),AV=['🦊','🐼','🐸','🐵','🦁','🐙','🦄','🐧','🐯','🐨','🐰','🦉','🐲','🐳','🦋','🐝','🐢','🦈','🤖','👻','👽','🎃','🐺','🦖'];
const L={S:'⊘',R:'⇄',D:'+2',W:'★',F:'+4'},CC={r:'#e53935',y:'#f5b800',g:'#1f9d55',b:'#2f6fed'};
let ws,S=null,seen=new Set(),lastTop=-1,av=+localStorage.av||0,endAt=0,pending=null,retry=0;
const sess=()=>{try{return JSON.parse(localStorage.sess||'null')}catch{return null}};
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{retry=0;$('#conn').style.display='none';const s=sess();if(s)send({t:'resume',code:s.code,token:s.token})};
  ws.onclose=()=>{$('#conn').style.display='block';setTimeout(connect,Math.min(1000*++retry,5000))};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==='joined')localStorage.sess=JSON.stringify({code:m.code,token:m.token});
    else if(m.t==='state'){S=m;endAt=Date.now()+m.ms;render()}
    else if(m.t==='err'){if(m.fatal){localStorage.removeItem('sess');S=null;show('home')}else $('#err').textContent=m.m}
    else if(m.t==='kicked'){localStorage.removeItem('sess');S=null;show('home');$('#err').textContent='You were removed by the host.'}
    else if(m.t==='chat')toast(m.n+': '+m.x)};
}
function toast(x){const d=document.createElement('div');d.textContent=x;$('#toast').append(d);setTimeout(()=>d.remove(),3500)}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id))}
function leave(){send({t:'leave'});localStorage.removeItem('sess');S=null;seen.clear();lastTop=-1;show('home')}
function av_el(p){const s=document.createElement('span');s.className='a';s.textContent=AV[p.av]||'🙂';return s}

// home
AV.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>{av=i;localStorage.av=i;paintAv()};$('#avs').append(b)});
const paintAv=()=>[...$('#avs').children].forEach((b,i)=>b.classList.toggle('sel',i===av));paintAv();
$('#name').value=localStorage.name||'';
const ident=()=>{const n=$('#name').value.trim();if(!n){$('#err').textContent='Enter your name first.';return null}localStorage.name=n;$('#err').textContent='';return{name:n,av}};
$('#create').onclick=()=>{const i=ident();if(i)send({t:'create',...i})};
$('#join').onclick=()=>{const i=ident();if(!i)return;const c=$('#code').value.trim();if(c.length!==6){$('#err').textContent='Room codes have 6 characters.';return}send({t:'join',code:c,...i})};
$('#leave1').onclick=$('#leave2').onclick=leave;
$('#start').onclick=()=>send({t:'start'});$('#again').onclick=()=>send({t:'restart'});
$('#lcode').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(S.code).then(()=>toast('Code copied'));
['👍','😂','😱','😎','🔥','🤬'].forEach(e=>{const b=document.createElement('button');b.textContent=e;b.onclick=()=>send({t:'chat',x:e});$('#emo').append(b)});
$('#uno').onclick=()=>send({t:'uno'});$('#catch').onclick=()=>send({t:'catch'});
$('#pass').onclick=()=>send({t:'pass'});

function render(){
  const me=S.players.find(p=>p.id===S.you),host=S.host===S.you;if(!me)return;
  if(S.phase==='lobby'){
    show('lobby');$('#lcode').textContent=S.code;$('#lcount').textContent=S.players.length+' / 10 players';
    const ul=$('#plist');ul.innerHTML='';
    S.players.forEach(p=>{const li=document.createElement('li');const n=document.createElement('span');n.className='nm';n.textContent=p.name+(p.id===S.host?' 👑':'')+(p.id===S.you?' (you)':'');
      li.append(av_el(p),n);if(host&&p.id!==S.you){const k=document.createElement('button');k.className='sm';k.textContent='Kick';k.onclick=()=>send({t:'kick',id:p.id});li.append(k)}ul.append(li)});
    $('#start').style.display=host?'':'none';$('#start').disabled=S.players.length<2;
    $('#wait').textContent=host?(S.players.length<2?'Waiting for at least one more player…':''):'Waiting for the host to start…';return;
  }
  show('game');$('#gcode').textContent=S.code;$('#deckn').textContent='Draw pile: '+S.deck;
  const mine=S.turn===S.you;
  const ch=$('#chips');ch.innerHTML='';
  S.players.forEach(p=>{const d=document.createElement('div');d.className='chip'+(p.id===S.turn?' turn':'')+(p.on?'':' off')+(p.id===S.you?' me':'');
    const s=document.createElement('small');s.textContent=p.name+(p.uno&&p.n<=2?' • UNO':'');const n=document.createElement('span');n.className='n';n.textContent=p.n;d.append(av_el(p),s,n);
    if(host&&p.id!==S.you){const x=document.createElement('button');x.className='x';x.textContent='✕';x.title='Kick';x.onclick=()=>confirm('Kick '+p.name+'?')&&send({t:'kick',id:p.id});d.append(x)}ch.append(d)});
  const cur=S.players.find(p=>p.id===S.turn);
  $('#dir').textContent=S.dir===1?'↻':'↺';$('#dir').classList.toggle('ccw',S.dir!==1);
  $('#ring').style.setProperty('--rc',CC[S.color]||'#fff');
  $('#log').textContent=S.log[S.log.length-1]||'';
  // piles
  const dp=$('#drawpile');dp.innerHTML='';const bk=document.createElement('div');bk.className='card back'+(mine&&S.drawn==null?' pulse':'');bk.innerHTML='<i>UNO</i>';bk.onclick=()=>mine&&S.drawn==null&&send({t:'draw'});dp.append(bk);
  if(S.top){const d=$('#disc');d.innerHTML='';const c=card(S.top);if(S.top.id!==lastTop){c.classList.add('land');lastTop=S.top.id}d.append(c)}
  // hand
  const h=$('#hand');h.innerHTML='';const ids=new Set();
  S.hand.forEach(c=>{ids.add(c.id);const e=card(c);const can=mine&&(S.drawn==null||S.drawn===c.id)&&(c.c==='w'||c.c===S.color||c.v===S.top.v);
    e.classList.add(can?'ok':'no');if(!seen.has(c.id))e.classList.add('deal');e.onclick=()=>{if(!can)return;if(c.c==='w'){pending=c.id;$('#colors').classList.add('on')}else send({t:'play',id:c.id})};h.append(e)});
  seen=ids;
  $('#pass').style.display=mine&&S.drawn!=null?'':'none';
  $('#uno').style.display=me.n<=2&&!me.uno?'':'none';
  $('#catch').style.display=S.catch&&S.catch!==S.you?'':'none';
  // game over
  const o=$('#over');o.classList.toggle('on',S.phase==='over');
  if(S.phase==='over'){const w=S.players.find(p=>p.id===S.winner);$('#wtxt').textContent=w?(w.id===S.you?'You win!':w.name+' wins!'):'Game over';$('#again').style.display=host?'':'none';$('#owait').textContent=host?'':'Waiting for the host to restart…'}
  tick();
}
function card(c){const e=document.createElement('div');e.className='card '+c.c;const t=L[c.v]||c.v;e.innerHTML='<b>'+t+'</b><i>'+t+'</i>';return e}
function tick(){if(!S||S.phase!=='playing')return;const cur=S.players.find(p=>p.id===S.turn);const s=Math.max(0,Math.ceil((endAt-Date.now())/1000));
  $('#banner').textContent=S.turn===S.you?'Your turn · '+s+'s':(cur?cur.name+"'s turn · "+s+'s':'')}
setInterval(tick,300);
$('#colors').onclick=e=>{const c=e.target.dataset&&e.target.dataset.c;if(c&&pending!=null){send({t:'play',id:pending,color:c});pending=null;$('#colors').classList.remove('on')}else if(e.target.id==='colors')$('#colors').classList.remove('on')};
connect();
</script></body></html>
